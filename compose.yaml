# Plantilla avanzada de despliegue; validar con Docker en el destino (no probado en Arena).
# Requiere dominio propio, hospedaje físicamente en Cuba o excepción jurídica documentada.
services:
  facturacion:
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      SEED_DEMO: "false"
      ALLOW_PUBLIC_DEMO: "false"
      TLS_MODE: proxy
      PUBLIC_ORIGIN: ${NEXO_PUBLIC_ORIGIN:?Define https://tu-dominio-propio}
      TRUST_PROXY: 172.28.0.2/32
      APP_PASSWORD_HASH_FILE: /run/secrets/nexo_access
      BACKUP_KEY_FILE: /run/secrets/nexo_backup
      DATA_CONTROLLER_NAME: ${DATA_CONTROLLER_NAME:?Identifica al Suministrador responsable}
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:?Identifica contacto de privacidad}
      DATA_LOCATION_COUNTRY: ${DATA_LOCATION_COUNTRY:-UNCONFIRMED}
      DATA_LOCATION_LEGAL_EXCEPTION_REFERENCE: ${DATA_LOCATION_LEGAL_EXCEPTION_REFERENCE:-}
    secrets:
      - nexo_access
      - nexo_backup
    volumes:
      - facturacion-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    pids_limit: 150
    networks:
      privada:
        ipv4_address: 172.28.0.3
  https:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      NEXO_DOMAIN: ${NEXO_DOMAIN:?Dominio propio sin protocolo ni ruta}
    ports:
      # Cambiar explícitamente NEXO_BIND_IP=0.0.0.0 SOLO tras aprobar publicación.
      - "${NEXO_BIND_IP:-127.0.0.1}:80:80"
      - "${NEXO_BIND_IP:-127.0.0.1}:443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      facturacion:
        condition: service_healthy
    networks:
      privada:
        ipv4_address: 172.28.0.2
      salida:
networks:
  privada:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  salida:
volumes:
  facturacion-data:
  caddy-data:
  caddy-config:
secrets:
  nexo_access:
    file: ${NEXO_ACCESS_HASH_FILE:?Ruta al hash scrypt privado}
  nexo_backup:
    file: ${NEXO_BACKUP_KEY_FILE:?Ruta a clave aleatoria privada de 32 bytes}
