services:
  facturacion:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      # Crea el primer administrador si la base aun no tiene cuentas.
      APP_PASSWORD: ${APP_PASSWORD:?Define APP_PASSWORD en .env (minimo 12 caracteres)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SEED_DEMO: ${SEED_DEMO:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Cifrado de las copias de seguridad (>=16 caracteres). Guardala fuera del servidor.
      BACKUP_KEY: ${BACKUP_KEY:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
      REQUIRE_ADMIN_2FA: ${REQUIRE_ADMIN_2FA:-false}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-self}
    volumes:
      - facturacion-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  facturacion-data:
